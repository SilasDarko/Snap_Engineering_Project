<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adinkra Symbols</title>
    <meta name="description" content="A Catalog of Adinkra Symbols" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="scripts.js"></script>
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">Adinkra Symbols</h1>
      <p class="subtitle">Sacred symbols of the Akan people of West Africa</p>
    </header>

    <main>
      <div id="filter-container">
        <div class="filter-left">
          <label for="category-filter">Filter by Category</label>
          <select id="category-filter" onchange="filterCards()">
            <option value="All">All Categories</option>
          </select>
        </div>
        <div class="filter-right">
          <input type="text" id="search-input" placeholder="Search symbols..." />
          <button id="add-symbol-btn">+ Add Symbol</button>
        </div>
      </div>

      <div id="card-container"></div>

      <div class="card" style="display: none">
        <div class="card-content">
          <h2>TV Show Title</h2>
          <span class="country-flag"></span>
          <img src="" alt="TV Show Poster" />
          <ul>
            <li>Bullet Point 1</li>
            <li>Bullet Point 2</li>
            <li>Bullet Point 3</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Add Symbol Modal -->
    <div class="modal-overlay" id="add-symbol-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Add a Symbol</h2>
          <button class="modal-close" id="close-modal">✕</button>
        </div>
        <form class="symbol-form" id="symbol-form">
          <div class="form-group">
            <label for="new-name">Symbol Name</label>
            <input type="text" id="new-name" placeholder="e.g. Adinkrahene" />
          </div>
          <div class="form-group">
            <label for="new-category">Category</label>
            <select id="new-category">
              <option value="">Select a category</option>
              <option>Courage & Strength</option>
              <option>Faith & Spirituality</option>
              <option>Leadership & Character</option>
              <option>Life & Caution</option>
              <option>Love & Relationships</option>
              <option>Unity & Community</option>
              <option>Wisdom</option>
            </select>
          </div>
          <div class="form-group">
            <label for="new-description">Description</label>
            <textarea id="new-description" rows="3" placeholder="Describe what this symbol means..."></textarea>
          </div>
          <div class="form-group">
            <label for="new-proverb">Proverb</label>
            <input type="text" id="new-proverb" placeholder="Associated proverb or saying..." />
          </div>
          <div class="form-group">
            <label for="new-image">Image URL</label>
            <input type="text" id="new-image" placeholder="e.g. src/symbols/mysymbol.gif" />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-btn">Cancel</button>
            <button type="submit" id="submit-btn">Add Symbol</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">
      <button onclick="quoteAlert()">Get A Quote!</button>
      <button onclick="removeLastCard()">Remove A Card!</button>
    </footer>
  </body>
</html>
